name: oracle-26ai-apex

# Oracle AI Database 26ai Free + ORDS 26.3 + APEX 26.2
# Database files and ORDS config remain in named volumes.
# Do not use `docker compose down -v` unless you intend to delete data.

services:
  database:
    image: container-registry.oracle.com/database/free:23.26.3.0
    container_name: ora26ai-db
    restart: unless-stopped
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?set ORACLE_PWD in .env}
      ORACLE_CHARACTERSET: AL32UTF8
    # No host port published. DB remains reachable by services on this Compose network.
    volumes:
      - oradata:/opt/oracle/oradata

  ords:
    image: container-registry.oracle.com/database/ords:26.3.0
    container_name: ora26ai-ords
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DBHOST: database
      DBPORT: 1521
      DBSERVICENAME: FREEPDB1
      ORACLE_PWD: ${ORACLE_PWD:?set ORACLE_PWD in .env}
      ORACLE_USER_PWD: ${ORDS_PUBLIC_PWD:?set ORDS_PUBLIC_PWD in .env}
      APEX_PWD: ${APEX_PUBLIC_PWD:?set APEX_PUBLIC_PWD in .env}
    # No host port published. Nginx reaches ORDS at http://ords:8080.
    volumes:
      - ords_config:/etc/ords/config
      - ./apex:/opt/oracle/apex
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8080/ords/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m

  nginx:
    image: nginx:alpine
    container_name: apex-nginx
    restart: unless-stopped
    depends_on:
      - ords
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apex/images:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  oradata:
  ords_config:
